name: Build and upload to PyPI

on:
  push:
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE
      - doc/
  release:
    types:
      - published

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Native targets: Linux x86-64, Windows x86-64, macOS ARM64.
      # Keep these runners aligned with tool.cibuildwheel in pyproject.toml.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1
        env:
          CIBW_BUILD_VERBOSITY: 1

      - uses: actions/upload-artifact@v6
        with:
          name: rehline-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  test_release_wheels:
    name: Independent objectives on release wheel / ${{ matrix.os }}
    needs: build_wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v7
        with:
          pattern: rehline-wheels-${{ matrix.os }}-*
          path: wheelhouse
          merge-multiple: true
      - run: python -m pip install packaging
      - name: Install exact release artifact and verify objectives
        run: >-
          python tools/test_release_wheel.py --wheel-dir wheelhouse
          --correctness-cases 256 --report-dir benchmarks/results/release-wheel
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: release-wheel-validation-${{ matrix.os }}
          path: benchmarks/results/release-wheel/

  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build and validate sdist
        run: |
          python -m pip install build twine "pybind11~=3.0.0" "setuptools>=80" setuptools-scm wheel
          python -m build --sdist
          python -m twine check dist/*
          python tools/check_sdist.py dist/*.tar.gz --wheel-dir sdist-wheel
          python -m pip install sdist-wheel/*.whl pytest pandas
          python tools/test_installed.py

      - uses: actions/upload-artifact@v6
        with:
          name: rehline-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [test, build_wheels, test_release_wheels, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    # or, alternatively, upload to PyPI on every tag starting with 'v' (remove on: release above to use this)
    # if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v7
        with:
          # unpacks all regot artifacts into dist/
          pattern: rehline-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        # with:
          # To test: repository-url: https://test.pypi.org/legacy/
