name: Set up independent benchmark checks
description: Fetch the standalone harness without replacing the ReHLine version under test
inputs:
  ref:
    description: Benchmark commit, tag or branch selected by the calling workflow
    default: main
  ssh-key:
    description: Read-only deploy key for the private benchmark repository
    required: true
  install:
    description: Install the harness into the current Python environment
    default: "true"
runs:
  using: composite
  steps:
    - name: Require benchmark read access
      shell: bash
      env:
        BENCHMARK_SSH_KEY: ${{ inputs.ssh-key }}
      run: |
        if [ -z "$BENCHMARK_SSH_KEY" ]; then
          echo "::error::REHLINE_BENCHMARKING_SSH_KEY is required to read the private benchmark repository. Fork pull requests do not receive this secret."
          exit 1
        fi
    - uses: actions/checkout@v4
      with:
        repository: softmin/ReHLine-benchmarking
        ref: ${{ inputs.ref }}
        path: .ci/benchmarking
        ssh-key: ${{ inputs.ssh-key }}
        persist-credentials: false
    - name: Record benchmark revision
      shell: bash
      run: git -C .ci/benchmarking rev-parse HEAD
    - name: Install benchmark helpers only
      if: inputs.install == 'true'
      shell: bash
      run: python -m pip install --no-deps ./.ci/benchmarking
